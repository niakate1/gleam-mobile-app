workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 18
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Sync Capacitor (copie www vers le projet iOS)
        script: |
          npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Build for iOS Simulator (test de compilation, sans signature Apple)
        script: |
          xcodebuild build \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator'
    artifacts:
      - /tmp/xcodebuild_logs/*.log
